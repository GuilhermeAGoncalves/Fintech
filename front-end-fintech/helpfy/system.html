<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HelpFy — Sistema</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: oklch(0.985 0.008 95);
    --surface: oklch(0.975 0.01 95);
    --surface-2: oklch(0.96 0.012 95);
    --surface-3: oklch(0.94 0.012 95);
    --ink: oklch(0.18 0.02 240);
    --ink-2: oklch(0.36 0.02 240);
    --ink-3: oklch(0.55 0.02 240);
    --ink-4: oklch(0.72 0.02 240);
    --border: oklch(0.9 0.008 95);
    --border-strong: oklch(0.84 0.01 95);
    --accent: oklch(0.62 0.15 155);
    --accent-2: oklch(0.55 0.16 155);
    --accent-ink: oklch(0.99 0.005 155);
    --accent-soft: oklch(0.93 0.05 155);
    --danger: oklch(0.62 0.18 25);
    --danger-soft: oklch(0.95 0.03 25);
    --warn: oklch(0.72 0.14 75);
    --warn-soft: oklch(0.95 0.04 75);
    --info: oklch(0.58 0.16 250);
    --info-soft: oklch(0.94 0.04 250);
    --radius: 14px;
    --radius-lg: 22px;
    --shadow-sm: 0 1px 0 oklch(0.18 0.02 240 / 0.04), 0 1px 2px oklch(0.18 0.02 240 / 0.04);
    --shadow-md: 0 4px 8px -2px oklch(0.18 0.02 240 / 0.06), 0 12px 24px -6px oklch(0.18 0.02 240 / 0.08);
    --shadow-lg: 0 12px 32px -8px oklch(0.18 0.02 240 / 0.18), 0 32px 64px -16px oklch(0.18 0.02 240 / 0.16);
    --sidebar-w: 248px;
    --header-h: 64px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 14.5px;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: 'ss01';
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; }
  .serif { font-family: 'Instrument Serif', serif; font-weight: 400; }
  .num { font-variant-numeric: tabular-nums; }

  /* ============ LOGIN ============ */
  .login {
    min-height: 100vh;
    display: grid;
    grid-template-columns: 1.05fr 1fr;
  }
  .login-side {
    background: oklch(0.17 0.025 240);
    color: oklch(0.96 0.008 95);
    padding: 40px 56px;
    display: flex; flex-direction: column;
    position: relative; overflow: hidden;
  }
  .login-side::before {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(50% 60% at 100% 0%, color-mix(in oklch, var(--accent) 28%, transparent), transparent 60%),
      radial-gradient(40% 50% at 0% 100%, color-mix(in oklch, var(--accent) 14%, transparent), transparent 60%);
  }
  .login-side > * { position: relative; z-index: 1; }
  .login-logo {
    display: flex; align-items: center; gap: 10px;
    font-weight: 800; font-size: 19px; letter-spacing: -0.02em;
  }
  .login-logo .mark {
    width: 32px; height: 32px; border-radius: 9px;
    background: oklch(0.96 0.008 95); color: oklch(0.17 0.025 240);
    display: grid; place-items: center; font-weight: 800;
    position: relative;
  }
  .login-logo .mark::after {
    content: ""; position: absolute; right: -3px; bottom: -3px;
    width: 12px; height: 12px; border-radius: 4px;
    background: var(--accent);
    border: 2px solid oklch(0.17 0.025 240);
  }
  .login-quote { margin: auto 0; }
  .login-eyebrow {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.14em;
    font-weight: 600; color: oklch(0.78 0.13 155);
    margin-bottom: 18px;
  }
  .login-quote h1 {
    font-size: 56px; line-height: 1.02; letter-spacing: -0.035em;
    font-weight: 700; margin: 0 0 24px;
  }
  .login-quote h1 em {
    font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400;
    color: oklch(0.82 0.16 155);
  }
  .login-quote p { font-size: 17px; color: oklch(0.78 0.02 95); max-width: 460px; line-height: 1.5; }
  .login-feats { display: flex; flex-direction: column; gap: 14px; margin-top: 32px; }
  .login-feat { display: flex; align-items: center; gap: 14px; font-size: 14.5px; color: oklch(0.82 0.015 95); }
  .login-feat .check {
    width: 28px; height: 28px; border-radius: 50%;
    background: oklch(0.78 0.13 155 / 0.2); color: oklch(0.82 0.16 155);
    display: grid; place-items: center; flex-shrink: 0;
  }
  .login-foot {
    display: flex; justify-content: space-between;
    font-size: 13px; color: oklch(0.65 0.02 95);
  }
  .login-form {
    display: flex; flex-direction: column;
    padding: 40px 56px;
    justify-content: center;
    max-width: 560px; width: 100%; justify-self: center;
  }
  .login-form-inner { max-width: 400px; width: 100%; margin: 0 auto; }
  .login-form h2 { font-size: 32px; letter-spacing: -0.025em; margin: 0 0 8px; font-weight: 700; }
  .login-form .sub { color: var(--ink-2); margin: 0 0 32px; font-size: 15px; }
  .login-tabs {
    display: flex; gap: 4px; padding: 4px;
    background: var(--surface-2); border-radius: 100px; margin-bottom: 28px;
    border: 1px solid var(--border);
  }
  .login-tab {
    flex: 1; padding: 9px 18px; border-radius: 100px;
    font-size: 14px; font-weight: 600; color: var(--ink-3); transition: all 0.15s;
  }
  .login-tab.active { background: var(--bg); color: var(--ink); box-shadow: var(--shadow-sm); }
  .field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
  .field-label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
  .field-input-wrap { position: relative; display: flex; align-items: center; }
  .field-input {
    width: 100%; padding: 13px 16px;
    background: var(--bg); border: 1px solid var(--border-strong);
    border-radius: 12px; font-size: 14.5px; font-family: inherit; color: var(--ink);
    transition: all 0.15s;
  }
  .field-input:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 4px color-mix(in oklch, var(--accent) 14%, transparent);
  }
  .field-eye {
    position: absolute; right: 12px;
    width: 28px; height: 28px; border-radius: 6px;
    color: var(--ink-3); display: grid; place-items: center;
  }
  .field-eye:hover { background: var(--surface-2); color: var(--ink-2); }
  .login-options {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; margin-bottom: 24px;
  }
  .checkbox { display: flex; align-items: center; gap: 8px; color: var(--ink-2); cursor: pointer; }
  .checkbox input { width: 16px; height: 16px; accent-color: var(--accent); }
  .login-forgot { color: var(--accent); font-weight: 600; }
  .login-submit {
    width: 100%; padding: 14px;
    background: var(--ink); color: var(--bg);
    border-radius: 12px; font-weight: 700; font-size: 15px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: all 0.15s;
  }
  .login-submit:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
  .login-submit:disabled { opacity: 0.7; transform: none; cursor: wait; }
  .login-divider {
    display: flex; align-items: center; gap: 14px;
    color: var(--ink-3); font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.1em; margin: 28px 0;
  }
  .login-divider::before, .login-divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .oauth-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .oauth {
    padding: 11px 12px; background: var(--bg); border: 1px solid var(--border-strong);
    border-radius: 12px; font-weight: 600; font-size: 14px;
    display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--ink);
  }
  .oauth:hover { background: var(--surface-2); }
  .login-cta-foot { margin-top: 28px; font-size: 14px; color: var(--ink-2); text-align: center; }
  .login-cta-foot a { color: var(--accent); font-weight: 600; cursor: pointer; }

  /* ============ APP LAYOUT ============ */
  .app {
    display: grid;
    grid-template-columns: var(--sidebar-w) 1fr;
    grid-template-rows: var(--header-h) 1fr;
    grid-template-areas: "sidebar header" "sidebar main";
    height: 100vh;
  }
  .sidebar {
    grid-area: sidebar; background: var(--surface);
    border-right: 1px solid var(--border); padding: 18px 14px;
    display: flex; flex-direction: column; overflow-y: auto;
  }
  .side-logo {
    display: flex; align-items: center; gap: 10px;
    font-weight: 800; font-size: 17px; letter-spacing: -0.02em;
    padding: 6px 10px 18px;
  }
  .side-logo .mark {
    width: 28px; height: 28px; border-radius: 8px;
    background: var(--ink); color: var(--bg);
    display: grid; place-items: center; font-weight: 800; font-size: 14px;
    position: relative;
  }
  .side-logo .mark::after {
    content: ""; position: absolute; right: -2px; bottom: -2px;
    width: 10px; height: 10px; border-radius: 3px;
    background: var(--accent); border: 2px solid var(--surface);
  }
  .side-section {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em;
    font-weight: 700; color: var(--ink-4); padding: 18px 10px 8px;
  }
  .side-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px; border-radius: 10px;
    font-size: 14px; font-weight: 500; color: var(--ink-2);
    margin-bottom: 2px; transition: all 0.12s; width: 100%; text-align: left;
  }
  .side-item:hover { background: var(--surface-2); color: var(--ink); }
  .side-item.active { background: var(--ink); color: var(--bg); }
  .side-item .side-ico { width: 18px; height: 18px; color: var(--ink-3); }
  .side-item.active .side-ico { color: var(--bg); }
  .side-item .badge {
    margin-left: auto; background: var(--accent); color: var(--accent-ink);
    font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 100px;
  }
  .side-item.active .badge { background: oklch(0.96 0.008 95 / 0.2); color: var(--bg); }
  .side-bottom { margin-top: auto; padding-top: 18px; border-top: 1px solid var(--border); }
  .side-profile {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 12px; background: var(--surface-2);
  }
  .side-profile .avatar {
    width: 34px; height: 34px; border-radius: 10px;
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; font-weight: 700; font-size: 14px; flex-shrink: 0;
  }
  .side-profile .who { flex: 1; min-width: 0; }
  .side-profile .name { font-size: 13.5px; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .side-profile .plan { font-size: 11px; color: var(--ink-3); }
  .side-profile button { color: var(--ink-3); padding: 4px; }

  .header {
    grid-area: header; border-bottom: 1px solid var(--border);
    padding: 0 28px; display: flex; align-items: center; gap: 16px;
    background: color-mix(in oklch, var(--bg) 85%, transparent);
    backdrop-filter: blur(10px); position: relative; z-index: 40;
  }
  .header h1 { font-size: 19px; font-weight: 700; letter-spacing: -0.015em; margin: 0; }
  .header h1 small { display: block; font-size: 12px; font-weight: 500; color: var(--ink-3); letter-spacing: 0; }
  .header-search { margin-left: 32px; flex: 1; max-width: 380px; position: relative; }
  .header-search input {
    width: 100%; padding: 9px 12px 9px 36px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; font-family: inherit; font-size: 13.5px; color: var(--ink);
  }
  .header-search input:focus { outline: none; border-color: var(--border-strong); background: var(--bg); }
  .header-search-ico { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--ink-3); width: 16px; height: 16px; }
  .header-search kbd {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    font-family: inherit; font-size: 11px; font-weight: 600; padding: 2px 6px;
    border-radius: 4px; background: var(--surface-2); color: var(--ink-3); border: 1px solid var(--border);
  }
  .header-actions { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 10px; color: var(--ink-2);
    display: grid; place-items: center; position: relative;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--ink); }
  .icon-btn .dot {
    position: absolute; top: 9px; right: 9px; width: 8px; height: 8px;
    border-radius: 50%; background: var(--accent); border: 2px solid var(--bg);
  }
  .btn-cta {
    padding: 8px 14px; background: var(--ink); color: var(--bg);
    border-radius: 10px; font-weight: 600; font-size: 13.5px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-cta:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
  .main { grid-area: main; overflow-y: auto; padding: 28px 32px 64px; }

  /* ============ DASHBOARD CARDS ============ */
  .grid { display: grid; gap: 16px; }
  .grid-3 { grid-template-columns: 2fr 1fr 1fr; }
  .grid-2 { grid-template-columns: 1fr 1fr; }
  .grid-4 { grid-template-columns: repeat(4, 1fr); }
  .grid-bal { grid-template-columns: 1.4fr 1fr 1fr 1fr; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 22px; }
  .card-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .card-h h3 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
  .card-h-sub { font-size: 12px; color: var(--ink-3); }
  .card-h-action { font-size: 13px; color: var(--accent); font-weight: 600; cursor: pointer; }

  .balance-hero {
    background: linear-gradient(135deg, oklch(0.17 0.025 240) 0%, oklch(0.22 0.04 240) 100%);
    color: oklch(0.96 0.008 95); border-radius: var(--radius-lg); padding: 28px;
    position: relative; overflow: hidden; border: none;
  }
  .balance-hero::after {
    content: ""; position: absolute; top: -40px; right: -40px;
    width: 220px; height: 220px; border-radius: 50%;
    background: radial-gradient(circle, color-mix(in oklch, var(--accent) 50%, transparent), transparent 70%);
  }
  .balance-hero .label {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.12em;
    font-weight: 600; opacity: 0.75; display: flex; align-items: center; gap: 10px;
  }
  .balance-hero .label button { color: inherit; opacity: 0.85; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; }
  .balance-hero .balance-val { font-size: 44px; font-weight: 700; letter-spacing: -0.025em; margin: 12px 0 4px; font-variant-numeric: tabular-nums; }
  .balance-hero .balance-delta { color: oklch(0.85 0.16 155); font-weight: 600; font-size: 14px; }
  .balance-hero .balance-row { display: flex; justify-content: space-between; align-items: end; margin-top: 20px; position: relative; }
  .balance-hero .acc-chip {
    padding: 5px 10px; background: oklch(0.3 0.03 240); border-radius: 100px;
    font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;
  }
  .balance-hero .acc-chip .d { width: 7px; height: 7px; border-radius: 50%; }

  .stat-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 22px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .stat-card .label { font-size: 12.5px; color: var(--ink-3); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; display: flex; align-items: center; gap: 8px; }
  .stat-card .label .ico { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
  .stat-card .label .ico.warn { background: var(--warn-soft); color: var(--warn); }
  .stat-card .label .ico.danger { background: var(--danger-soft); color: var(--danger); }
  .stat-card .label .ico.info { background: var(--info-soft); color: var(--info); }
  .stat-card .val { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; margin-top: 4px; }
  .stat-card .delta { font-size: 12.5px; font-weight: 600; }
  .stat-card .delta.up { color: var(--accent); }
  .stat-card .delta.down { color: var(--danger); }
  .stat-card .delta.neutral { color: var(--ink-3); }

  .chart-card { padding: 22px; }
  .chart { height: 220px; position: relative; margin-top: 8px; }
  .chart svg { width: 100%; height: 100%; overflow: visible; }
  .chart-legend { display: flex; gap: 18px; margin-top: 16px; font-size: 13px; color: var(--ink-2); }
  .chart-legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: middle; }

  .tx-row { display: grid; grid-template-columns: 36px 1fr auto auto; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .tx-row:last-child { border-bottom: none; }
  .tx-ico { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
  .tx-ico.out { background: var(--danger-soft); color: var(--danger); }
  .tx-ico.invest { background: var(--info-soft); color: var(--info); }
  .tx-ico.debt { background: var(--warn-soft); color: var(--warn); }
  .tx-title { font-weight: 600; font-size: 14px; }
  .tx-sub { font-size: 12px; color: var(--ink-3); margin-top: 1px; }
  .tx-cat { font-size: 12px; font-weight: 600; color: var(--ink-2); padding: 4px 9px; background: var(--surface-2); border-radius: 100px; border: 1px solid var(--border); }
  .tx-amt { font-weight: 700; font-size: 14.5px; color: var(--accent); font-variant-numeric: tabular-nums; }
  .tx-amt.neg { color: var(--danger); }
  .tx-amt.neutral { color: var(--ink); }

  .quick-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .quick-action {
    padding: 16px 12px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; display: flex; flex-direction: column; align-items: center; gap: 10px;
    font-weight: 600; font-size: 12.5px; color: var(--ink); text-align: center; transition: all 0.15s;
  }
  .quick-action:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: var(--shadow-md); }
  .quick-action .qa-ico { width: 38px; height: 38px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }

  .goal-mini { padding: 14px 0; border-bottom: 1px solid var(--border); }
  .goal-mini:last-child { border-bottom: none; }
  .goal-mini-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: 600; font-size: 14px; }
  .goal-mini-head .pct { color: var(--accent); font-weight: 700; font-size: 13px; }
  .goal-mini-bar { height: 6px; background: var(--surface-2); border-radius: 100px; overflow: hidden; }
  .goal-mini-fill { height: 100%; background: var(--accent); border-radius: 100px; }
  .goal-mini-meta { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink-3); margin-top: 6px; }
  .goal-mini-meta b { color: var(--ink-2); font-variant-numeric: tabular-nums; }

  .list-card { padding: 0; overflow: hidden; }
  .list-card-head { padding: 18px 22px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .filters { display: flex; gap: 6px; }
  .filter-chip { padding: 6px 12px; border-radius: 100px; background: var(--surface-2); border: 1px solid var(--border); font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
  .filter-chip.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .table { display: flex; flex-direction: column; overflow-x: auto; }
  .table-row { display: grid; grid-template-columns: 40px 2fr 1fr 1fr 1fr 90px; gap: 16px; align-items: center; padding: 14px 22px; border-bottom: 1px solid var(--border); font-size: 13.5px; min-width: 680px; }
  .table-row.head { background: var(--surface-2); font-size: 11px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.08em; padding: 12px 22px; }
  .table-row:last-child { border-bottom: none; }
  .table-row:hover:not(.head) { background: var(--surface-2); }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 100px; font-size: 11.5px; font-weight: 600; background: var(--surface-2); border: 1px solid var(--border); color: var(--ink-2); }
  .pill .d { width: 6px; height: 6px; border-radius: 50%; }

  .inv-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; }
  .inv-card-h { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
  .inv-card-h .ico { width: 40px; height: 40px; border-radius: 10px; background: var(--info-soft); color: var(--info); display: grid; place-items: center; }
  .inv-card h4 { margin: 0; font-size: 15px; font-weight: 700; }

// ============ MODAIS ============
const CATS_IN  = ['Salário','Vendas','Hora extra','Pix recebido','Investim.','Outros'];
const CATS_OUT = ['Mercado','Alimentação','Transporte','Moradia','Lazer','Saúde','Educação','Outros'];
const BANK_OPTS = [
  {name:'Nubank',   color:'oklch(0.55 0.2 305)'},
  {name:'Itaú',     color:'oklch(0.7 0.18 50)' },
  {name:'Inter',    color:'oklch(0.65 0.2 30)'  },
  {name:'Carteira', color:'oklch(0.55 0.02 240)'},
];
const today = () => { const d=new Date(); return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`; };
const isoDate = () => new Date().toISOString().slice(0,10);

function Modal({ ico, kind, title, sub, onClose, onSubmit, submitLabel, accent, children, canSubmit=true }) {
  useEffect(() => {
    const onKey=(e)=>{ if(e.key==='Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose]);
  const accentClass={in:'',out:'out',invest:'invest',goal:''}[accent]||'';
  const btnClass={in:'',out:'danger',invest:'info',goal:''}[accent]||'';
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={(e)=>e.stopPropagation()}>
        <div className="modal-head">
          <div className={`modal-ico ${accentClass}`}>{ico}</div>
          <div><div className="modal-title">{title}</div><div className="modal-sub">{sub}</div></div>
          <button className="modal-close" onClick={onClose} aria-label="Fechar">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M6 6l12 12M6 18L18 6" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>
          </button>
        </div>
        <div className="modal-body">{children}</div>
        <div className="modal-foot">
          <button className="btn-secondary" onClick={onClose}>Cancelar</button>
          <button className={`btn-submit ${btnClass}`} onClick={()=>canSubmit&&onSubmit?.()} disabled={!canSubmit}>
            {submitLabel} <I.Arrow style={{width:14,height:14}}/>
          </button>
        </div>
      </div>
    </div>
  );
}

function AmountField({ value, onChange, color, helper }) {
  return (
    <div className={`amount-input ${color}`}>
      <div className="lbl">Valor</div>
      <div className="val">
        <small>R$</small>
        <input className="val-edit" type="number" inputMode="decimal" min="0" step="0.01" value={value} onChange={(e)=>onChange(e.target.value)}/>
      </div>
      {helper && <div className="helper">{helper}</div>}
    </div>
  );
}

function ReceitaModal({ onClose, onSubmit }) {
  const [num,setNum]=useState(450);
  const [date,setDate]=useState('hoje');
  const [bank,setBank]=useState('Nubank');
  const [cat,setCat]=useState('Vendas');
  const [desc,setDesc]=useState('');
  return (
    <Modal ico={<I.Income/>} title="Nova receita" sub={`Entrada de dinheiro · ${today()}`} onClose={onClose} onSubmit={()=>onSubmit({num,date,bank,cat,desc})} submitLabel="Adicionar receita" accent="in" canSubmit={num>0}>
      <AmountField value={num} onChange={(v)=>setNum(Number(v)||0)} color="accent" helper="Use ponto para os centavos · ex: 450.00"/>
      <div className="field"><label className="field-label">Data da entrada</label>
        <div className="date-row">
          {[{k:'ontem',l:'Ontem'},{k:'hoje',l:'Hoje'},{k:'amanha',l:'Amanhã'}].map(d=><button key={d.k} className={`date-pill ${date===d.k?'active':''}`} onClick={()=>setDate(d.k)}>{d.l}</button>)}
          <input className="date-pill" type="date" defaultValue={isoDate()} onChange={()=>setDate('custom')} style={{padding:'6px 10px'}}/>
        </div>
      </div>
      <div className="field"><label className="field-label">Conta</label>
        <div className="pick-grid">{BANK_OPTS.map(b=><button key={b.name} className={`pick-card ${bank===b.name?'active':''}`} onClick={()=>setBank(b.name)}><span className="pick-card-ico dot" style={{background:b.color}}></span><span>{b.name}</span></button>)}</div>
      </div>
      <div className="field"><label className="field-label">Categoria</label>
        <div className="chip-select">{CATS_IN.map(c=><button key={c} className={`chip-opt ${cat===c?'active':''}`} onClick={()=>setCat(c)}>{c}</button>)}</div>
      </div>
      <div className="field"><label className="field-label">Descrição (opcional)</label>
        <textarea className="field-input textarea" placeholder="Ex: Hora extra do projeto X" value={desc} onChange={(e)=>setDesc(e.target.value)}/>
      </div>
    </Modal>
  );
}

function GastoModal({ onClose, onSubmit }) {
  const [num,setNum]=useState(46);
  const [date,setDate]=useState('hoje');
  const [bank,setBank]=useState('Nubank');
  const [cat,setCat]=useState('Mercado');
  const [desc,setDesc]=useState('');
  const [recurring,setRecurring]=useState(false);
  return (
    <Modal ico={<I.Expense/>} title="Novo gasto" sub={`Saída de despesa · ${today()}`} onClose={onClose} onSubmit={()=>onSubmit({num,date,bank,cat,desc,recurring})} submitLabel="Adicionar gasto" accent="out" canSubmit={num>0}>
      <AmountField value={num} onChange={(v)=>setNum(Number(v)||0)} color="danger out" helper="O valor será subtraído do saldo da conta"/>
      <div className="field"><label className="field-label">Data da saída</label>
        <div className="date-row">
          {[{k:'ontem',l:'Ontem'},{k:'hoje',l:'Hoje'},{k:'amanha',l:'Amanhã'}].map(d=><button key={d.k} className={`date-pill ${date===d.k?'active':''}`} onClick={()=>setDate(d.k)}>{d.l}</button>)}
          <input className="date-pill" type="date" defaultValue={isoDate()} onChange={()=>setDate('custom')} style={{padding:'6px 10px'}}/>
        </div>
      </div>
      <div className="field"><label className="field-label">Conta de origem</label>
        <div className="pick-grid">{BANK_OPTS.map(b=><button key={b.name} className={`pick-card ${bank===b.name?'active':''}`} onClick={()=>setBank(b.name)}><span className="pick-card-ico dot" style={{background:b.color}}></span><span>{b.name}</span></button>)}</div>
      </div>
      <div className="field"><label className="field-label">Categoria</label>
        <div className="chip-select">{CATS_OUT.map(c=><button key={c} className={`chip-opt ${cat===c?'active':''}`} onClick={()=>setCat(c)}>{c}</button>)}</div>
      </div>
      <div className="field"><label className="field-label">Descrição (opcional)</label>
        <textarea className="field-input textarea" placeholder="Ex: Compra mensal mercado" value={desc} onChange={(e)=>setDesc(e.target.value)}/>
      </div>
      <label className="checkbox" style={{fontSize:13.5,fontWeight:500,color:'var(--ink-2)'}}>
        <input type="checkbox" checked={recurring} onChange={(e)=>setRecurring(e.target.checked)}/><span>Repetir todo mês neste dia</span>
      </label>
    </Modal>
  );
}

const INV_TYPES = [
  {k:'tesouro',label:'Tesouro Direto',ico:<I.Coins/>,color:'oklch(0.62 0.15 155)'},
  {k:'cdb',    label:'CDB / LCI',     ico:<I.Wallet/>,color:'oklch(0.58 0.16 250)'},
  {k:'acoes',  label:'Ações / FII',   ico:<I.Chart/>, color:'oklch(0.7 0.16 60)'},
  {k:'cripto', label:'Cripto',        ico:<I.Invest/>,color:'oklch(0.6 0.2 295)'},
];

function AporteModal({ onClose, onSubmit }) {
  const [num,setNum]=useState(800);
  const [type,setType]=useState('tesouro');
  const [asset,setAsset]=useState('Tesouro IPCA+ 2029');
  const [bank,setBank]=useState('Inter');
  const [rate,setRate]=useState('IPCA + 6,2%');
  const [date,setDate]=useState('hoje');
  const suggestions={tesouro:['Tesouro IPCA+ 2029','Tesouro Selic 2027','Tesouro Prefixado 2028'],cdb:['CDB Banco Inter 110%','CDB Nubank 105%','LCI Itaú 95%'],acoes:['ITSA4','BBSE3','BOVA11','HGLG11'],cripto:['Bitcoin','Ethereum','Solana']};
  return (
    <Modal ico={<I.Invest/>} title="Novo aporte" sub={`Investimento · ${today()}`} onClose={onClose} onSubmit={()=>onSubmit({num,type,asset,bank,rate,date})} submitLabel="Registrar aporte" accent="invest" canSubmit={num>0&&asset.trim().length>0}>
      <AmountField value={num} onChange={(v)=>setNum(Number(v)||0)} color="info" helper="Será debitado da conta escolhida"/>
      <div className="field"><label className="field-label">Tipo de investimento</label>
        <div className="pick-grid">{INV_TYPES.map(t=><button key={t.k} className={`pick-card ${type===t.k?'active':''}`} onClick={()=>{setType(t.k);setAsset(suggestions[t.k][0]);}}><span className="pick-card-ico" style={{background:type===t.k?'oklch(0.96 0.008 95 / 0.15)':'color-mix(in oklch, '+t.color+' 14%, var(--surface-2))',color:type===t.k?'var(--bg)':t.color}}>{t.ico}</span><span>{t.label}</span></button>)}</div>
      </div>
      <div className="field"><label className="field-label">Ativo</label>
        <input className="field-input" value={asset} onChange={(e)=>setAsset(e.target.value)} placeholder="Ex: Tesouro IPCA+ 2029" list={`assets-${type}`}/>
        <datalist id={`assets-${type}`}>{suggestions[type].map(s=><option key={s} value={s}/>)}</datalist>
        <div className="date-row" style={{marginTop:6}}>{suggestions[type].slice(0,3).map(s=><button key={s} className={`date-pill ${asset===s?'active':''}`} onClick={()=>setAsset(s)}>{s}</button>)}</div>
      </div>
      <div className="field-grid">
        <div className="field"><label className="field-label">Conta de origem</label>
          <div className="chip-select">{BANK_OPTS.map(b=><button key={b.name} className={`chip-opt ${bank===b.name?'active':''}`} onClick={()=>setBank(b.name)}><span className="d" style={{background:b.color}}/> {b.name}</button>)}</div>
        </div>
        <div className="field"><label className="field-label">Rentabilidade esperada</label>
          <input className="field-input" value={rate} onChange={(e)=>setRate(e.target.value)} placeholder="Ex: CDI · 12% a.a."/>
        </div>
      </div>
      <div className="field"><label className="field-label">Data do aporte</label>
        <div className="date-row">
          {[{k:'ontem',l:'Ontem'},{k:'hoje',l:'Hoje'}].map(d=><button key={d.k} className={`date-pill ${date===d.k?'active':''}`} onClick={()=>setDate(d.k)}>{d.l}</button>)}
          <input className="date-pill" type="date" defaultValue={isoDate()} onChange={()=>setDate('custom')} style={{padding:'6px 10px'}}/>
        </div>
      </div>
    </Modal>
  );
}


function AppShell({ onLogout }) {
  const [active,setActive]=useState('dashboard');
  const [modal,setModal]=useState(null);
  const [toast,setToast]=useState(null);

  const handleSubmit=(kind)=>{
    setModal(null);
    const labels={receita:'Receita adicionada',gasto:'Gasto adicionado',aporte:'Aporte registrado'};
    setToast(labels[kind]||'Salvo');
    setTimeout(()=>setToast(null),2400);
  };

  const Page={
    dashboard:<Dashboard goTo={setActive} onAdd={setModal}/>,
    receitas:<TxList filterType="in" title="Recebido" onAdd={()=>setModal('receita')}/>,
    gastos:<TxList filterType="out" title="Gasto" onAdd={()=>setModal('gasto')}/>,
    dividas:<Dividas/>,
    investimentos:<Investimentos onAdd={()=>setModal('aporte')}/>,
    config:<Config/>,
  }[active];

  return (
    <div className="app">
      <Sidebar active={active} setActive={setActive} onLogout={onLogout}/>
      <Header active={active} onAdd={setModal}/>
      <main className="main" key={active}><div className="fade-in">{Page}</div></main>
      {modal==='receita'  && <ReceitaModal  onClose={()=>setModal(null)} onSubmit={()=>handleSubmit('receita')}/>}
      {modal==='gasto'    && <GastoModal    onClose={()=>setModal(null)} onSubmit={()=>handleSubmit('gasto')}/>}
      {modal==='aporte'   && <AporteModal   onClose={()=>setModal(null)} onSubmit={()=>handleSubmit('aporte')}/>}
      {toast && (
        <div className="toast">
          <span className="check"><svg viewBox="0 0 24 24" width="14" height="14" fill="none"><path d="M5 12l4 4 10-10" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"/></svg></span>
          {toast}
        </div>
      )}
    </div>
  );
}

function Root() {
  const [logged,setLogged]=useState(false);
  return logged
    ? <AppShell onLogout={()=>setLogged(false)}/>
    : <Login onSubmit={()=>setLogged(true)}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>
