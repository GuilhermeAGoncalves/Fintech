<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HelpFy — Help Financially</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: oklch(0.985 0.008 95);
    --surface: oklch(0.975 0.01 95);
    --surface-2: oklch(0.96 0.012 95);
    --ink: oklch(0.18 0.02 241);
    --ink-2: oklch(0.36 0.02 240);
    --ink-3: oklch(0.55 0.02 240);
    --border: oklch(0.9 0.008 95);
    --border-strong: oklch(0.84 0.01 95);
    --accent: oklch(0.62 0.15 155);
    --accent-ink: oklch(0.99 0.005 155);
    --accent-soft: oklch(0.93 0.05 155);
    --danger: oklch(0.62 0.18 25);
    --danger-soft: oklch(0.95 0.03 25);
    --warn: oklch(0.75 0.13 75);
    --dark-bg: oklch(0.17 0.025 240);
    --dark-surface: oklch(0.21 0.025 240);
    --dark-border: oklch(0.28 0.02 240);
    --dark-ink: oklch(0.96 0.008 95);
    --dark-ink-2: oklch(0.78 0.02 240);
    --radius: 14px;
    --radius-lg: 22px;
    --shadow-sm: 0 1px 0 oklch(0.18 0.02 240 / 0.04), 0 1px 2px oklch(0.18 0.02 240 / 0.04);
    --shadow-md: 0 4px 8px -2px oklch(0.18 0.02 240 / 0.06), 0 12px 24px -6px oklch(0.18 0.02 240 / 0.08);
    --shadow-lg: 0 12px 32px -8px oklch(0.18 0.02 240 / 0.18), 0 32px 64px -16px oklch(0.18 0.02 240 / 0.16);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: 'ss01', 'cv11';
  }
  .serif { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; letter-spacing: -0.01em; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .num { font-variant-numeric: tabular-nums; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }

  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 32px; }

  /* ============ NAV ============ */
  .nav {
    position: sticky; top: 0; z-index: 50;
    backdrop-filter: blur(14px) saturate(140%);
    background: color-mix(in oklch, var(--bg) 78%, transparent);
    border-bottom: 1px solid var(--border);
  }
  .nav-inner {
    display: flex; align-items: center; justify-content: space-between;
    height: 72px;
  }
  .logo {
    display: flex; align-items: center; gap: 10px;
    font-weight: 800; font-size: 19px; letter-spacing: -0.02em;
  }
  .logo-mark {
    width: 30px; height: 30px; border-radius: 9px;
    background: var(--ink); color: var(--bg);
    display: grid; place-items: center;
    font-weight: 800; font-size: 16px;
    position: relative;
  }
  .logo-mark::after {
    content: ""; position: absolute; right: -3px; bottom: -3px;
    width: 12px; height: 12px; border-radius: 4px;
    background: var(--accent);
    border: 2px solid var(--bg);
  }
  .nav-links { display: flex; gap: 36px; font-size: 14.5px; font-weight: 500; color: var(--ink-2); }
  .nav-links a:hover { color: var(--ink); }
  .nav-cta { display: flex; gap: 10px; align-items: center; }

  /* ============ BUTTONS ============ */
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 11px 18px;
    border-radius: 100px;
    border: 1px solid transparent;
    font-weight: 600; font-size: 14.5px;
    transition: all 0.15s ease;
    white-space: nowrap;
  }
  .btn-primary {
    background: var(--ink); color: var(--bg);
    border-color: var(--ink);
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
  .btn-accent {
    background: var(--accent); color: var(--accent-ink);
  }
  .btn-accent:hover { transform: translateY(-1px); box-shadow: 0 8px 16px -4px color-mix(in oklch, var(--accent) 40%, transparent); }
  .btn-ghost {
    background: transparent; color: var(--ink); border-color: var(--border-strong);
  }
  .btn-ghost:hover { background: var(--surface-2); }
  .btn-sm { padding: 7px 14px; font-size: 13px; }
  .btn-lg { padding: 14px 24px; font-size: 15.5px; }

  /* ============ HERO ============ */
  .hero { padding: 64px 0 96px; position: relative; overflow: hidden; }
  .hero-grid {
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    gap: 72px;
    align-items: center;
  }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 12px 6px 8px; border-radius: 100px;
    background: var(--surface);
    border: 1px solid var(--border);
    font-size: 13px; font-weight: 500; color: var(--ink-2);
    margin-bottom: 28px;
  }
  .eyebrow-dot {
    width: 18px; height: 18px; border-radius: 50%; background: var(--accent);
    display: grid; place-items: center; color: var(--accent-ink);
    font-size: 11px;
  }
  .hero h1 {
    font-size: clamp(46px, 6.2vw, 84px);
    line-height: 0.98;
    letter-spacing: -0.035em;
    margin: 0 0 24px;
    font-weight: 700;
    color: var(--ink);
  }
  .hero h1 .accent-word {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-weight: 400;
    color: var(--accent);
    letter-spacing: -0.01em;
  }
  .hero h1 .strike {
    text-decoration: line-through;
    text-decoration-thickness: 4px;
    text-decoration-color: color-mix(in oklch, var(--ink) 30%, transparent);
    color: var(--ink-3);
    font-weight: 600;
  }
  .hero-sub {
    font-size: 19px; color: var(--ink-2); max-width: 540px;
    line-height: 1.5; margin-bottom: 36px;
    text-wrap: pretty;
  }
  .hero-ctas { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .hero-trust {
    margin-top: 44px;
    display: flex; gap: 28px; align-items: center;
    color: var(--ink-3); font-size: 13px;
  }
  .avatars { display: flex; }
  .avatars span {
    width: 28px; height: 28px; border-radius: 50%;
    border: 2px solid var(--bg);
    margin-left: -8px;
    background: var(--surface-2);
    display: grid; place-items: center;
    font-size: 11px; font-weight: 600; color: var(--ink-2);
  }
  .avatars span:first-child { margin-left: 0; }
  .stars { color: oklch(0.75 0.13 75); letter-spacing: 1px; }

  /* hero right: phone */
  .phone-stage { position: relative; display: grid; place-items: center; min-height: 580px; }
  .phone-stage::before {
    content: ""; position: absolute; inset: -10% -20%;
    background:
      radial-gradient(60% 50% at 50% 50%, color-mix(in oklch, var(--accent) 22%, transparent), transparent 70%);
    z-index: 0;
    filter: blur(4px);
  }

  /* ============ PHONE MOCKUP ============ */
  .phone {
    position: relative; z-index: 1;
    width: 340px; height: 700px;
    background: oklch(0.12 0.015 240);
    border-radius: 46px;
    padding: 12px;
    box-shadow: var(--shadow-lg), inset 0 0 0 1px oklch(0.3 0.02 240);
  }
  .phone-screen {
    width: 100%; height: 100%;
    background: var(--bg);
    border-radius: 36px;
    overflow: hidden;
    position: relative;
    display: flex; flex-direction: column;
  }
  .phone-notch {
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    width: 100px; height: 28px; background: oklch(0.12 0.015 240);
    border-radius: 100px; z-index: 5;
  }
  .status-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 28px 0;
    font-size: 13px; font-weight: 600; color: var(--ink);
  }
  .status-icons { display: flex; gap: 5px; align-items: center; }
  .status-icons span { display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: var(--ink); }
  .status-icons .bat { width: 22px; height: 11px; border: 1.2px solid var(--ink); border-radius: 3px; position: relative; }
  .status-icons .bat::before { content:""; position:absolute; inset:1px; width:70%; background: var(--ink); border-radius: 1px; }
  .status-icons .bat::after { content:""; position:absolute; right:-3px; top:3px; width:2px; height:5px; background: var(--ink); border-radius: 0 1px 1px 0; }

  /* ===== floating cards next to phone ===== */
  .float-card {
    position: absolute; z-index: 2;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px 16px;
    box-shadow: var(--shadow-md);
    font-size: 13px;
    display: flex; align-items: center; gap: 12px;
  }
  .fc-icon {
    width: 36px; height: 36px; border-radius: 10px;
    display: grid; place-items: center;
    background: var(--accent-soft); color: var(--accent);
    font-weight: 700;
  }
  .float-card-1 { top: 14%; left: -8%; }
  .float-card-2 { bottom: 12%; right: -14%; }
  .fc-label { color: var(--ink-3); font-size: 11px; margin-bottom: 2px; text-transform: uppercase; letter-spacing: 0.06em; }
  .fc-value { font-weight: 700; color: var(--ink); font-size: 15px; }
  .fc-value.up { color: var(--accent); }
  .fc-value.down { color: var(--danger); }

  /* ============ LOGO STRIP ============ */
  .strip {
    padding: 36px 0;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }
  .strip-inner {
    display: flex; align-items: center; gap: 56px; justify-content: space-between;
    flex-wrap: wrap;
  }
  .strip-label {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--ink-3); font-weight: 600;
  }
  .strip-banks {
    display: flex; gap: 40px; flex-wrap: wrap; align-items: center;
    color: var(--ink-2);
  }
  .strip-banks span {
    font-weight: 700; font-size: 17px;
    opacity: 0.55;
    letter-spacing: -0.01em;
  }

  /* ============ PILLARS ============ */
  .section { padding: 120px 0; }
  .section-head {
    max-width: 720px; margin: 0 auto 64px; text-align: center;
  }
  .section-eyebrow {
    display: inline-block; font-size: 12px; text-transform: uppercase;
    letter-spacing: 0.14em; font-weight: 600; color: var(--accent);
    margin-bottom: 14px;
  }
  .section-title {
    font-size: clamp(34px, 4.5vw, 56px);
    line-height: 1.05; letter-spacing: -0.03em;
    margin: 0 0 16px; font-weight: 700;
    text-wrap: balance;
  }
  .section-title em {
    font-family: 'Instrument Serif', serif;
    font-weight: 400; font-style: italic; color: var(--accent);
  }
  .section-sub {
    font-size: 18px; color: var(--ink-2);
    text-wrap: pretty;
  }

  .pillars {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
  }
  .pillar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 28px 24px 24px;
    transition: all 0.2s ease;
    position: relative; overflow: hidden;
  }
  .pillar:hover {
    transform: translateY(-3px);
    border-color: var(--border-strong);
    box-shadow: var(--shadow-md);
  }
  .pillar-icon {
    width: 44px; height: 44px; border-radius: 12px;
    display: grid; place-items: center;
    margin-bottom: 24px;
    background: var(--accent-soft); color: var(--accent);
  }
  .pillar-icon svg { width: 22px; height: 22px; }
  .pillar h3 { margin: 0 0 8px; font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
  .pillar p { margin: 0; color: var(--ink-2); font-size: 14.5px; line-height: 1.5; }
  .pillar-tag {
    position: absolute; top: 22px; right: 22px;
    font-size: 11px; font-weight: 600; color: var(--ink-3);
    text-transform: uppercase; letter-spacing: 0.08em;
  }

  /* ============ DARK PRODUCT SECTION ============ */
  .dark-section {
    background: var(--dark-bg); color: var(--dark-ink);
    border-radius: 32px;
    margin: 0 24px;
    padding: 96px 0;
    position: relative; overflow: hidden;
  }
  .dark-section .section-title { color: var(--dark-ink); }
  .dark-section .section-sub { color: var(--dark-ink-2); }
  .dark-section .section-eyebrow { color: oklch(0.78 0.13 155); }
  .dark-section::before {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(60% 60% at 10% 10%, color-mix(in oklch, var(--accent) 18%, transparent), transparent 60%),
      radial-gradient(50% 50% at 90% 90%, color-mix(in oklch, var(--accent) 10%, transparent), transparent 60%);
    pointer-events: none;
  }
  .dark-section .wrap { position: relative; }

  .showcase-grid {
    display: grid; grid-template-columns: 1fr 0.9fr; gap: 80px;
    align-items: center; margin-top: 60px;
  }
  .showcase-left .section-title { text-align: left; }
  .showcase-features { display: flex; flex-direction: column; gap: 16px; margin-top: 40px; }
  .showcase-feature {
    display: flex; gap: 16px; align-items: flex-start;
    padding: 18px 20px;
    background: oklch(0.21 0.025 240 / 0.6);
    border: 1px solid var(--dark-border);
    border-radius: 16px;
    transition: all 0.2s ease;
    cursor: pointer;
  }
  .showcase-feature:hover, .showcase-feature.active {
    background: oklch(0.24 0.03 240);
    border-color: oklch(0.78 0.13 155 / 0.6);
  }
  .showcase-feature.active .sf-icon { background: var(--accent); color: var(--dark-bg); }
  .sf-icon {
    width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0;
    background: oklch(0.26 0.03 240); color: oklch(0.78 0.13 155);
    display: grid; place-items: center;
    transition: all 0.2s ease;
  }
  .sf-icon svg { width: 18px; height: 18px; }
  .sf-text h4 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
  .sf-text p { margin: 0; font-size: 14px; color: var(--dark-ink-2); line-height: 1.5; }

  .showcase-mock {
    background: oklch(0.22 0.025 240);
    border: 1px solid var(--dark-border);
    border-radius: 24px;
    padding: 22px;
    box-shadow: var(--shadow-lg);
  }

  /* ============ DASHBOARD-WEB MOCKUP ============ */
  .db {
    background: var(--bg); color: var(--ink);
    border-radius: 18px;
    padding: 18px;
    display: flex; flex-direction: column; gap: 14px;
    min-height: 540px;
  }
  .db-head { display: flex; justify-content: space-between; align-items: center; }
  .db-greet { font-size: 13px; color: var(--ink-3); }
  .db-greet b { color: var(--ink); font-weight: 700; font-size: 15px; display: block; }
  .db-avatar {
    width: 36px; height: 36px; border-radius: 50%; background: var(--accent);
    color: var(--accent-ink); display: grid; place-items: center;
    font-weight: 700; font-size: 14px;
  }
  .db-balance {
    background: linear-gradient(135deg, var(--ink) 0%, oklch(0.28 0.04 240) 100%);
    color: var(--bg);
    border-radius: 16px;
    padding: 22px 22px 20px;
    position: relative; overflow: hidden;
  }
  .db-balance::after {
    content: ""; position: absolute; top: -40px; right: -30px;
    width: 140px; height: 140px; border-radius: 50%;
    background: radial-gradient(circle, color-mix(in oklch, var(--accent) 50%, transparent), transparent 70%);
  }
  .db-balance-label {
    font-size: 12px; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.1em;
    font-weight: 500; margin-bottom: 6px;
    display: flex; align-items: center; gap: 8px;
  }
  .db-balance-eye {
    width: 16px; height: 16px; border-radius: 50%;
    border: 1.2px solid currentColor; display: inline-grid; place-items: center;
    opacity: 0.8;
  }
  .db-balance-eye::after { content: ""; width: 4px; height: 4px; border-radius: 50%; background: currentColor; }
  .db-balance-value {
    font-size: 30px; font-weight: 700; letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }
  .db-balance-date {
    margin-top: 12px; font-size: 12px; opacity: 0.7;
    display: flex; justify-content: space-between;
  }
  .db-balance-delta {
    color: oklch(0.85 0.16 155); font-weight: 600;
  }
  .db-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .db-action {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 8px;
    text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    transition: all 0.15s ease;
    cursor: pointer;
  }
  .db-action:hover { transform: translateY(-2px); border-color: var(--accent); }
  .db-action-icon {
    width: 30px; height: 30px; border-radius: 8px;
    background: var(--accent-soft); color: var(--accent);
    display: grid; place-items: center;
  }
  .db-action-icon svg { width: 16px; height: 16px; }
  .db-action span { font-size: 11px; font-weight: 600; color: var(--ink-2); line-height: 1.2; }

  .db-section-title {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 13px; color: var(--ink-3); font-weight: 600;
    margin-top: 4px;
    text-transform: uppercase; letter-spacing: 0.08em;
  }
  .db-section-title a { color: var(--accent); text-transform: none; letter-spacing: 0; font-weight: 600; font-size: 12.5px; cursor: pointer; }

  .db-tx-list { display: flex; flex-direction: column; gap: 8px; }
  .db-tx {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  .db-tx-ico {
    width: 32px; height: 32px; border-radius: 8px;
    display: grid; place-items: center;
    background: var(--accent-soft); color: var(--accent);
  }
  .db-tx-ico.out { background: var(--danger-soft); color: var(--danger); }
  .db-tx-ico svg { width: 14px; height: 14px; }
  .db-tx-body { flex: 1; min-width: 0; }
  .db-tx-title { font-size: 13px; font-weight: 600; color: var(--ink); }
  .db-tx-sub { font-size: 11.5px; color: var(--ink-3); }
  .db-tx-amt { font-size: 13.5px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
  .db-tx-amt.neg { color: var(--danger); }

  /* ============ FORM MOCKUP "Nova receita" ============ */
  .form-mock {
    background: var(--bg); color: var(--ink);
    border-radius: 18px;
    padding: 22px;
    min-height: 540px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .form-head { display: flex; align-items: center; gap: 12px; }
  .form-back {
    width: 32px; height: 32px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface);
    display: grid; place-items: center; color: var(--ink-2);
  }
  .form-title { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
  .form-amount {
    text-align: center; padding: 24px 0 8px;
  }
  .form-amount-label {
    font-size: 12px; color: var(--ink-3); text-transform: uppercase;
    letter-spacing: 0.1em; font-weight: 600; margin-bottom: 6px;
  }
  .form-amount-value {
    font-size: 44px; font-weight: 700; color: var(--accent);
    letter-spacing: -0.02em; font-variant-numeric: tabular-nums;
  }
  .form-amount-value small { font-size: 22px; opacity: 0.7; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field-label { font-size: 12px; color: var(--ink-3); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; }
  .field-input {
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 14px; font-weight: 500;
    display: flex; align-items: center; justify-content: space-between;
  }
  .field-input.chip-row { gap: 6px; padding: 8px; flex-wrap: wrap; }
  .chip {
    padding: 5px 10px; border-radius: 100px;
    background: var(--surface-2); font-size: 12px; font-weight: 600;
    border: 1px solid var(--border);
  }
  .chip.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .form-submit {
    margin-top: auto;
    background: var(--accent); color: var(--accent-ink);
    text-align: center; padding: 14px; border-radius: 12px;
    font-weight: 700; font-size: 15px;
  }

  /* ============ GOALS ============ */
  .goals-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 48px;
    align-items: center;
  }
  .goal-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 20px;
    margin-bottom: 14px;
    transition: all 0.2s ease;
  }
  .goal-card:hover { border-color: var(--border-strong); transform: translateX(4px); }
  .goal-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 14px;
  }
